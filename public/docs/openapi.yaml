openapi: 3.0.3
info:
  title: Graha Pondasi ERP — Field API v1
  version: 1.0.0
  description: >
    API untuk aplikasi lapangan (mobile/PWA). Autentikasi memakai Bearer token
    dari endpoint auth/token (Sanctum). Konteks perusahaan dikirim via header
    X-Company-Id yang harus menjadi membership aktif pemilik token.
servers:
  - url: '{base}/api'
    variables:
      base:
        default: https://your-domain.com
security:
  - bearerAuth: []
paths:
  /v1/auth/token:
    post:
      summary: Terbitkan token API
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: admin@grahapondasi.test }
                password: { type: string, example: password }
                device: { type: string, example: tablet-rig-01 }
      responses:
        '200': { description: Token diterbitkan }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/projects:
    get:
      summary: Daftar proyek perusahaan aktif
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: Paginated project list }
        '403': { description: Bukan anggota perusahaan }
  /v1/bored-piles:
    get:
      summary: Titik bored pile pada satu proyek
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
        - { name: project_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: Daftar titik pile }
        '404': { description: Proyek tidak ditemukan di perusahaan ini }
  /v1/daily-reports:
    post:
      summary: Kirim daily report lapangan (butuh permission project.manage)
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, report_date, work_summary]
              properties:
                project_id: { type: integer }
                report_date: { type: string, format: date }
                weather: { type: string }
                manpower_count: { type: integer }
                work_summary: { type: string }
                issues: { type: string }
      responses:
        '201': { description: Daily report dibuat }
        '403': { description: Tanpa permission }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/material-requests:
    get:
      summary: Daftar permintaan material terbaru
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
      responses:
        '200': { description: Daftar permintaan dengan lines }
    post:
      summary: Ajukan permintaan material (butuh permission inventory.manage)
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, project_id, warehouse_id, lines]
              properties:
                number: { type: string }
                project_id: { type: integer }
                warehouse_id: { type: integer }
                bored_pile_id: { type: integer, nullable: true }
                notes: { type: string }
                lines:
                  type: array
                  items:
                    type: object
                    required: [sku, quantity]
                    properties:
                      sku: { type: string }
                      quantity: { type: number }
      responses:
        '201': { description: Permintaan dibuat status requested }
        '403': { description: Tanpa permission }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/cages:
    get:
      summary: Daftar reinforcement cage (butuh permission manufacturing.view)
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
        - { name: qc_status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: Paginated cage list (dengan relasi pile) }
        '403': { description: Tanpa permission }
  /v1/casings:
    get:
      summary: Daftar casing pile (butuh permission equipment.view)
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
      responses:
        '200': { description: Daftar casing unit dengan lokasi pile saat ini }
        '403': { description: Tanpa permission }
  /v1/fuel-tanks:
    get:
      summary: Daftar tangki BBM (butuh permission equipment.view)
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
      responses:
        '200': { description: Daftar tangki BBM perusahaan aktif }
        '403': { description: Tanpa permission }
  /v1/tools:
    get:
      summary: Daftar tools (butuh permission inventory.view)
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [available, checked_out, lost] } }
      responses:
        '200': { description: Daftar tools dan status check-out }
        '403': { description: Tanpa permission }
  /v1/equipment:
    get:
      summary: Daftar equipment (butuh permission equipment.view)
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: Daftar equipment perusahaan aktif }
        '403': { description: Tanpa permission }
  /v1/constraints:
    get:
      summary: Constraint log proyek (ADR-049; butuh permission project.view)
      description: >
        Read-only. Transisi open -> in_progress -> resolved dijaga di UI/service;
        resolusi wajib catatan dan kendala selesai tidak dapat dibuka ulang.
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
        - { name: project_id, in: query, required: true, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, resolved] } }
      responses:
        '200': { description: Maksimal 200 baris constraint terbaru }
        '403': { description: Tanpa permission }
        '404': { description: Proyek tidak ditemukan di perusahaan ini }
  /v1/procurement-plans:
    get:
      summary: Rencana pengadaan proyek (ADR-050; butuh permission procurement.view)
      description: >
        Setiap baris memuat flag is_late = lewat tanggal tanpa PR dan PO
        (tidak dibatalkan), sesuai definisi keterlambatan rencana pengadaan.
      parameters:
        - { name: X-Company-Id, in: header, required: true, schema: { type: integer } }
        - { name: project_id, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: Baris rencana pengadaan + flag is_late + taut item }
        '403': { description: Tanpa permission }
        '404': { description: Proyek tidak ditemukan di perusahaan ini }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    ValidationError:
      description: Validasi gagal
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties: { type: array, items: { type: string } }
